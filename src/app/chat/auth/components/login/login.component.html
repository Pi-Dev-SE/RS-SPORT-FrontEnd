<div class="wrapper">
  <form>
    <h1>Login</h1>
    <div class="p-fluid">
      <input type="text" pInputText [(ngModel)]="user.firstname" placeholder="Username" name="username" />
    </div>
    <div class="p-fluid">
      <p-password [(ngModel)]="user.password" [feedback]="false" placeholder="Password" [toggleMask]="true" name="password" />
    </div>
    <div class="p-fluid mt-2">
      <p-button label="Login" (click)="login()" [disabled]="!user.firstname || !user.password"></p-button>
    </div>
  </form>
</div>
