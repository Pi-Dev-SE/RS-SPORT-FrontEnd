<div class="exercise-detail-container">
    <h2>Détails de l'exercice</h2>
  
    <div *ngIf="exercise && exercise.name && exercise.duration && exercise.exerciseType && exercise.description && exercise.objectif">
        <p><strong>Nom :</strong> {{ exercise?.name }}</p>//-
        <div *ngIf="exercise && exercise.name && exercise.duration && exercise.exerciseType && exercise.description && exercise.objectif">//+
            <p><strong>Nom :</strong> {{ exercise?.name }}</p>//+
            <!-- ... rest of the component -->//+
        </div>//+
        <p><strong>Durée :</strong> {{ exercise?.duration }} minutes</p>
        <p><strong>Type :</strong> {{ exercise?.exerciseType }}</p>
        <p><strong>Description :</strong> {{ exercise?.description }}</p>
        <p><strong>Objectif :</strong> {{ exercise?.objectif }}</p>

        <div *ngIf="exercise.image">
            <p><strong>Image :</strong></p>
            <img [src]="exercise?.image" alt="Image de l'exercice" class="exercise-image" *ngIf="exercise.image && exercise.image.length > 0"/>
        </div>

        <button (click)="editExercise()" class="edit-btn" aria-label="Modifier l'exercice">Modifier</button>
        <button (click)="deleteExercise()" class="delete-btn" aria-label="Supprimer l'exercice">Supprimer</button>
    </div>
  
    <div *ngIf="!exercise || !exercise.name">
        <p>Aucun exercice trouvé.</p>
    </div>
</div>
