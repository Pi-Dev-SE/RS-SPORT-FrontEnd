<!-- Our Team Start Here-->
<div class="our-team-section team-inner-page sec-spacer">
  <div class="container">
    <div class="row">
      <div
        class="col-md-3 col-sm-6 col-xs-6"
        *ngFor="let video of videos | paginate: { itemsPerPage: 4, currentPage: p }"
      >
        <div class="our-team">
          <img src="/assets/FrontOffice/images/team/view-soccer-ball-field.jpg" alt="" />
          <div class="person-details">
            <div class="overly-bg"></div>
            <a routerLink="../getVideoStatisticsById/{{video.videoStatisticsId}}">
              <h5 class="person-name">Statistics</h5>
            </a>
            <table class="person-info">
              <tbody>
                <tr>
                  <td>Total Distance Covered :</td>
                  <td>{{video.totalDistanceCovered}} (km)</td>
                </tr>
                <tr>
                  <td>Sprint Distance :</td>
                  <td>{{video.sprintDistance}} (m)</td>
                </tr>
                <tr>
                  <td>Top Speed :</td>
                  <td>{{video.topSpeed}} (km/h)</td>
                </tr>
                <tr>
                  <td>Pass Accuracy :</td>
                  <td>{{video.passAccuracy}} (%)</td>
                </tr>
                <tr>
                  <td>Total Pass Nombre :</td>
                  <td>{{video.passNbr}}</td>
                </tr>
                <tr>
                  <td>Min Speed :</td>
                  <td>{{video.minSpeed}} (km/h)</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Centered Pagination Controls -->
    <div class="col-12 d-flex justify-content-center mt-4">
      <pagination-controls
        (pageChange)="p = $event"
        [previousLabel]="'←'"
        [nextLabel]="'→'"
        [directionLinks]="true"
        [autoHide]="false"
      ></pagination-controls>
    </div>
  </div>
</div>
<!-- Our Team end Here-->
