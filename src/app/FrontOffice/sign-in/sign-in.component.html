<div class="rs-breadcrumbs breadcrumbs-overlay">
    <div class="breadcrumbs-img">
        <img src="assets/FrontOffice/images/breadcrumbs/2.jpg" alt="Breadcrumbs Image">
    </div>
    <div class="breadcrumbs-text white-color">
        <h1 class="page-title">Connexion</h1>
        <ul>
            <li>
                <a class="active" href="/">Accueil</a>
            </li>
            <li>Connexion</li>
        </ul>
    </div>
</div>

<div class="rs-login pt-100 pb-100 md-pt-70 md-pb-70">
    <div class="container">
        <div class="noticed">
            <div class="main-part">
                <div class="method-account">
                    <h2 class="login">Connexion</h2>
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                        <div *ngIf="errorMessage" class="alert alert-danger">
                            {{ errorMessage }}
                        </div>

                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" formControlName="email" class="form-control" [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)}">
                            <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="invalid-feedback">
                                <div *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis</div>
                                <div *ngIf="loginForm.get('email')?.errors?.['email']">Veuillez entrer un email valide</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Mot de passe *</label>
                            <div class="password-input-container">
                                <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" class="form-control" [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)}">
                                <span class="password-toggle" (click)="togglePasswordVisibility()">
                                    <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </span>
                            </div>
                            <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="invalid-feedback">
                                <div *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est requis</div>
                                <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <button type="submit" [disabled]="loginForm.invalid || isSubmitting" class="readon">
                                <span *ngIf="isSubmitting">Connexion en cours...</span>
                                <span *ngIf="!isSubmitting">Se connecter</span>
                            </button>
                        </div>

                        <div class="last-password">
                            <p>Vous n'avez pas de compte? <a href="/signup">Créer un compte</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
