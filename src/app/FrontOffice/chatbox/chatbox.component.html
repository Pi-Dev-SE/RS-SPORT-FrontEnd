<div class="chatbox" *ngIf="isChatOpen">
    <div class="chat-header">
        <div class="header-content">
            <img src="assets/whatsapp.jpg" alt="WhatsApp"> WhatsApp
        </div>
        <span class="close-btn" (click)="toggleChat()">✖</span>
    </div>
    <div class="chat-body">
        <div class="message">Hi. How can we help you?</div>
        <div class="qr-code-container" *ngIf="showQrCode">
            <img src="assets/qrcode.png" alt="WhatsApp QR Code" class="qr-code">
            <div class="qr-code-text">Scan the code to start chatting</div>
        </div>
    </div>
    <div class="chat-footer">
        <button class="open-chat" (click)="openWhatsApp()">
            <div class="button-content">
                <img src="assets/whatsapp.jpg" alt="WhatsApp Icon">
                Open chat
            </div>
        </button>
        <button class="qr-code-btn" (click)="toggleQrCode()">
            <div class="button-content">
                <i class="qr-icon">QR</i>
                Show QR Code
            </div>
        </button>
    </div>
</div>

<!-- Bouton flottant pour ouvrir le chat -->
<button class="floating-btn" (click)="toggleChat()" *ngIf="!isChatOpen">
    <img src="assets/whatsapp.jpg" alt="WhatsApp">
</button>
